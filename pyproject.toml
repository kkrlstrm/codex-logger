[project]
name = "codex-logger"
version = "0.1.0"
description = "Local black box recorder for OpenAI Codex CLI: reconstructs full agent runs from ~/.codex/sessions rollout files into a queryable SQLite/Postgres database. Captures what hooks miss (apply_patch, MCP, subagents)."
requires-python = ">=3.10"
dependencies = []           # SQLite path is pure stdlib

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]   # only needed for a postgresql:// target
dev = ["pytest>=7"]

[project.scripts]
codex-logger = "codex_logger.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codex_logger"]
